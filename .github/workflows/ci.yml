name: Integração contínua

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes-unitarios:
    name: Testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Executar testes unitários
        run: >-
          python -m unittest
          tests.test_auth_controller
          tests.test_etapas_controller
          tests.test_resultados_controller

  testes-integracao:
    name: Testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Executar testes de integração
        run: |
          python -m unittest \
            tests.test_acesso_entre_contas \
            tests.test_autorizacao_por_rota \
            tests.test_consultas_progresso \
            tests.test_criancas \
            tests.test_dashboard \
            tests.test_fluxo_resultados_integracao \
            tests.test_jwt_e_cors \
            tests.test_limite_tentativas \
            tests.test_logs_auditoria \
            tests.test_minimizacao_logs \
            tests.test_protecao_xss \
            tests.test_registro_exclusao \
            tests.test_resultados_api_integracao \
            tests.test_resultados_erros_api_integracao \
            tests.test_resultados_persistencia_integracao \
            tests.test_rotas_inexistentes \
            tests.test_seguranca_e_fluxo_integracao \
            tests.test_sessao_unica \
            tests.test_trilha_etapas
          python -m unittest discover -s tests -p "test_erros_e_persistencia_http.py"
          python -m unittest discover -s tests -p "test_integracao_caminho_feliz_http.py"

  linter:
    name: Linter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Validar estilo do back-end
        run: ruff check backend
